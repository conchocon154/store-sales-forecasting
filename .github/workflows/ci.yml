name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      # The data is Kaggle's to distribute, so CI runs the tests that build
      # their own frames — which is all of them, on purpose.
      - run: python -m pytest tests/ -q
